
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입덕볶이 커뮤니티</title>

    <!-- Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/community.css">
</head>

<body>

    <div class="main-container">

        <!-- HEADER -->
        <header class="header">

            <a href="../../index.html" class="logo">
                <img src="img/logo.png" alt="입덕볶이 로고">
            </a>

            <button class="menu-btn" id="menuOpen" aria-label="메뉴 열기">
                <i data-lucide="menu"></i>
            </button>

        </header>


        <!-- 전체 메뉴 -->
        <div class="menu-overlay" id="menuOverlay">

            <div class="menu-header">
                <button class="close-btn" id="menuClose" aria-label="메뉴 닫기">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <nav class="menu-list">
                <a href="../../sub/lists/list.html">떡볶이 메뉴</a>
                <a href="../../menu_main/introduce/introduce.html">소개</a>
                <a href="../../menu_main/community/community.html">커뮤니티</a>
                <a href="../../menu_main/login/login.html">로그인</a>
            </nav>

        </div>


        <main class="community-content">

            <!-- =========================
                 COMMUNITY INTRO
            ========================== -->

            <section class="community-intro">

                <div class="intro-text">
                    <h1>입덕볶이 커뮤니티</h1>

                    <p>
                        입덕볶이와 맛있는 이야기를<br>
                        나누어요
                    </p>
                </div>

                <div class="intro-character">
                    <img src="img/original_character.png" alt="입덕볶이 캐릭터">
                </div>

            </section>


            <!-- =========================
                 CATEGORY TABS
            ========================== -->

            <nav class="community-tabs">

                <button class="community-tab active" data-category="all">
                    전체
                </button>

                <button class="community-tab" data-category="review">
                    메뉴후기
                </button>

                <button class="community-tab" data-category="combination">
                    꿀조합 추천
                </button>

                <button class="community-tab" data-category="question">
                    질문/요청
                </button>

            </nav>


            <!-- =========================
                 COMMUNITY POSTS
            ========================== -->

            <section class="post-section">

                <div class="post-list" id="postList">

                    <!-- 게시글 1 -->
                    <article class="post-card" data-category="review">

                        <div class="post-image">
                            <img src="img/original.png" alt="오리지널 입덕볶이">
                        </div>

                        <div class="post-content">

                            <span class="post-tag">메뉴 후기</span>

                            <p class="post-description">
                                입덕볶이 기본 떡볶이 후기!<br>
                                역시 믿고 먹는 맛이에요 ❤️
                            </p>

                            <div class="post-actions">

                                <button class="like-btn" aria-label="좋아요">
                                    <i data-lucide="heart"></i>
                                </button>

                                <button class="comment-btn" aria-label="댓글">
                                    <i data-lucide="message-circle"></i>
                                </button>

                            </div>

                        </div>

                    </article>


                    <!-- 게시글 2 -->
                    <article class="post-card" data-category="combination">

                        <div class="post-image">
                            <img src="img/original.png" alt="로제 입덕볶이">
                        </div>

                        <div class="post-content">

                            <span class="post-tag">꿀조합 추천</span>

                            <p class="post-description">
                                로제 떡볶이에 튀김조합<br>
                                강추해요!
                            </p>

                            <div class="post-actions">

                                <button class="like-btn" aria-label="좋아요">
                                    <i data-lucide="heart"></i>
                                </button>

                                <button class="comment-btn" aria-label="댓글">
                                    <i data-lucide="message-circle"></i>
                                </button>

                            </div>

                        </div>

                    </article>


                    <!-- 게시글 3 -->
                    <article class="post-card" data-category="question">

                        <div class="post-image">
                            <img src="img/original.png" alt="치즈 입덕볶이">
                        </div>

                        <div class="post-content">

                            <span class="post-tag">메뉴 후기</span>

                            <p class="post-description">
                                치즈 떡볶이, 먹어도 치즈 떡이<br>
                                라서 맛있어요!
                            </p>

                            <div class="post-actions">

                                <button class="like-btn" aria-label="좋아요">
                                    <i data-lucide="heart"></i>
                                </button>

                                <button class="comment-btn" aria-label="댓글">
                                    <i data-lucide="message-circle"></i>
                                </button>

                            </div>

                        </div>

                    </article>

                </div>

            </section>


            <!-- =========================
                 FLOATING CHAT BUTTON
            ========================== -->

            <button class="chat-button" id="chatButton" aria-label="커뮤니티 채팅">
                <i data-lucide="message-circle-more"></i>
            </button>

        </main>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        lucide.createIcons();


        /* =========================
           HEADER MENU
        ========================== */

        const menuOpen = document.getElementById('menuOpen');
        const menuClose = document.getElementById('menuClose');
        const menuOverlay = document.getElementById('menuOverlay');

        menuOpen.addEventListener('click', () => {
            menuOverlay.classList.add('active');
            document.body.classList.add('menu-open');
        });

        menuClose.addEventListener('click', () => {
            menuOverlay.classList.remove('active');
            document.body.classList.remove('menu-open');
        });


        /* =========================
           COMMUNITY CATEGORY
        ========================== */

        const communityTabs = document.querySelectorAll('.community-tab');
        const postCards = document.querySelectorAll('.post-card');

        communityTabs.forEach(tab => {

            tab.addEventListener('click', () => {

                const selectedCategory = tab.dataset.category;

                // 탭 활성화
                communityTabs.forEach(item => {
                    item.classList.remove('active');
                });

                tab.classList.add('active');

                // 게시글 필터링
                postCards.forEach(card => {

                    const cardCategory = card.dataset.category;

                    if (
                        selectedCategory === 'all' ||
                        cardCategory === selectedCategory
                    ) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }

                });

            });

        });


        /* =========================
           LIKE BUTTON
        ========================== */

        const likeButtons = document.querySelectorAll('.like-btn');

        likeButtons.forEach(button => {

            button.addEventListener('click', () => {

                button.classList.toggle('liked');

                const icon = button.querySelector('i');

                if (button.classList.contains('liked')) {
                    icon.style.fill = '#E8452E';
                    icon.style.color = '#E8452E';
                } else {
                    icon.style.fill = 'none';
                    icon.style.color = '#000000';
                }

            });

        });


        /* =========================
           COMMENT BUTTON
        ========================== */

        const commentButtons = document.querySelectorAll('.comment-btn');

        commentButtons.forEach(button => {

            button.addEventListener('click', () => {

                alert('댓글 기능은 추후 구현할 예정입니다.');

            });

        });


        /* =========================
           CHAT BUTTON
        ========================== */

        const chatButton = document.getElementById('chatButton');

        chatButton.addEventListener('click', () => {

            alert('커뮤니티 채팅 기능은 추후 구현할 예정입니다.');

        });

    </script>

</body>
</html>
