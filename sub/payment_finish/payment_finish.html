
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입덕볶이 결제 완료</title>

    <!-- Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/payment_finish.css">
</head>

<body>

    <div class="main-container">

        <!-- HEADER -->
        <header class="header">

            <a href="../../index.html" class="logo">
                <img src="img/logo.png" alt="입덕볶이 로고">
            </a>

            <button class="menu-btn" id="menuOpen" aria-label="메뉴 열기">
                <i data-lucide="menu"></i>
            </button>

        </header>


        <!-- 전체 메뉴 -->
        <div class="menu-overlay" id="menuOverlay">

            <div class="menu-header">
                <button class="close-btn" id="menuClose" aria-label="메뉴 닫기">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <nav class="menu-list">
                <a href="../../sub/lists/list.html">떡볶이 메뉴</a>
                <a href="../../menu_main/introduce/introduce.html">소개</a>
                <a href="../../menu_main/community/community.html">커뮤니티</a>
                <a href="../../menu_main/login/login.html">로그인</a>
            </nav>

        </div>


        <!-- =========================
             결제 완료 상단 바
        ========================== -->

        <section class="complete-header">

            <h1>결제 완료</h1>

            <button type="button" id="closeComplete" aria-label="메인페이지로 이동">
                <a href="../../index.html"><i data-lucide="x"></i></a>
            </button>

        </section>


        <main class="complete-content">

            <!-- =========================
                 상품 이미지
            ========================== -->

            <section class="complete-product">

                <div class="complete-image">
                    <img src="img/original.png" alt="주문한 떡볶이">
                </div>

            </section>


            <!-- =========================
                 결제 완료 안내
            ========================== -->

            <section class="complete-message">

                <h2>
                    결제가 완료 되었습니다
                    <i data-lucide="check-circle" class="success-icon"></i>
                </h2>

            </section>


            <!-- =========================
                 주문 내역
            ========================== -->

            <section class="receipt-card">

                <h3>배달 주문</h3>

                <div class="receipt-info">

                    <div class="receipt-row">
                        <span>주문한 메뉴</span>
                        <strong id="orderMenu">00떡볶이 x 1개</strong>
                    </div>

                    <div class="receipt-row">
                        <span>할인 금액</span>
                        <strong id="discountPrice">00000원</strong>
                    </div>

                    <div class="receipt-row">
                        <span>배달비</span>
                        <strong id="deliveryPrice">00000원</strong>
                    </div>

                    <div class="receipt-row">
                        <span>주문 일시</span>
                        <strong id="orderDate">2026.00.00 (요일) 00:00</strong>
                    </div>

                </div>


                <!-- 총 결제 금액 -->

                <div class="receipt-total">

                    <h3>총 금액</h3>

                    <strong id="totalPrice">00000원</strong>

                </div>

            </section>

        </main>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        // Lucide 아이콘
        lucide.createIcons();


        /* =========================
           HEADER MENU
        ========================= */

        const menuOpen = document.getElementById('menuOpen');
        const menuClose = document.getElementById('menuClose');
        const menuOverlay = document.getElementById('menuOverlay');

        menuOpen.addEventListener('click', () => {
            menuOverlay.classList.add('active');
            document.body.classList.add('menu-open');
        });

        menuClose.addEventListener('click', () => {
            menuOverlay.classList.remove('active');
            document.body.classList.remove('menu-open');
        });


        /* =========================
           MAIN PAGE 이동
        ========================= */

        document.getElementById('closeComplete').addEventListener('click', () => {
            window.location.href = 'index.html';
        });


        /* =========================
           ORDER INFORMATION
        ========================= */

        const orderData = {

            name: '오리지널 입덕볶이',
            image: './images/menu-original.png',
            quantity: 1,
            menuPrice: 14000,
            discount: 0,
            delivery: 3000

        };


        // URL에 주문 정보가 전달되면 사용
        const params = new URLSearchParams(window.location.search);

        const menuNames = {
            original: '오리지널 입덕볶이',
            cheese: '치즈 입덕볶이',
            mala: '마라 입덕볶이',
            rose: '로제 입덕볶이',
            jjajang: '짜장 입덕볶이'
        };

        const menuImages = {
            original: './images/menu-original.png',
            cheese: './images/menu-cheese.png',
            mala: './images/menu-mala.png',
            rose: './images/menu-rose.png',
            jjajang: './images/menu-jjajang.png'
        };

        const menuId = params.get('menu') || 'original';

        orderData.name = menuNames[menuId] || orderData.name;
        orderData.image = menuImages[menuId] || orderData.image;

        orderData.quantity = Math.max(
            1,
            Number(params.get('quantity')) || 1
        );

        orderData.menuPrice = Number(
            params.get('menuPrice')
        ) || orderData.menuPrice;

        orderData.discount = Number(
            params.get('discount')
        ) || 0;

        orderData.delivery = Number(
            params.get('delivery')
        ) || orderData.delivery;


        /* =========================
           ORDER DATE
        ========================= */

        const now = new Date();

        const dateText =
            now.getFullYear() + '.' +
            String(now.getMonth() + 1).padStart(2, '0') + '.' +
            String(now.getDate()).padStart(2, '0') +
            ' (' +
            ['일', '월', '화', '수', '목', '금', '토'][now.getDay()] +
            ') ' +
            String(now.getHours()).padStart(2, '0') + ':' +
            String(now.getMinutes()).padStart(2, '0');


        /* =========================
           DISPLAY ORDER INFORMATION
        ========================= */

        const totalAmount =
            orderData.menuPrice * orderData.quantity
            + orderData.delivery
            - orderData.discount;

        document.getElementById('productImage').src =
            orderData.image;

        document.getElementById('productImage').alt =
            orderData.name;

        document.getElementById('orderMenu').textContent =
            orderData.name + ' x ' + orderData.quantity + '개';

        document.getElementById('discountPrice').textContent =
            orderData.discount.toLocaleString('ko-KR') + '원';

        document.getElementById('deliveryPrice').textContent =
            orderData.delivery.toLocaleString('ko-KR') + '원';

        document.getElementById('orderDate').textContent =
            dateText;

        document.getElementById('totalPrice').textContent =
            totalAmount.toLocaleString('ko-KR') + '원';

    </script>

</body>
</html>
